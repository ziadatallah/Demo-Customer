services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: isaf
      POSTGRES_USER: isaf
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U isaf"], interval: 10s, timeout: 5s, retries: 10}
  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key,s3_secret_key]
    volumes: [object_data:/data]
  migrate:
    build: ..
    command: ["npm","run","db:migrate"]
    working_dir: /app/07_Web_Service
    env_file: production.env
    depends_on: {postgres: {condition: service_healthy}}
    profiles: [setup]
  web:
    build: ..
    command: ["node","server.js"]
    working_dir: /app/07_Web_Service
    env_file: production.env
    ports: ["3000:3000"]
    depends_on: {postgres: {condition: service_healthy}, object-storage: {condition: service_started}}
    restart: unless-stopped
  worker:
    build: ..
    command: ["node","durable/worker_cli.js"]
    working_dir: /app/07_Web_Service
    env_file: production.env
    depends_on: {postgres: {condition: service_healthy}, object-storage: {condition: service_started}}
    restart: unless-stopped
secrets:
  postgres_password: {file: ./secrets/postgres_password.txt}
  s3_access_key: {file: ./secrets/s3_access_key.txt}
  s3_secret_key: {file: ./secrets/s3_secret_key.txt}
volumes: {postgres_data: {}, object_data: {}}
